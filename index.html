
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Home — Crash Out Studio</title>
    <meta
      name="description"
      content="Crash Out Studio is a creative design studio specializing in branding, editorial design, illustration, advertising, photography and merchandise."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Crash Out Studio — Creative Design Studio" />
    <meta
      property="og:description"
      content="Explore the creative projects and design services of Crash Out Studio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://studio-crashout.com/" />
    <meta property="og:image" content="https://studio-crashout.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Crash Out Studio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crash Out Studio — Creative Design Studio" />
    <meta
      name="twitter:description"
      content="Explore the creative projects and design services of Crash Out Studio."
    />
    <meta name="twitter:image" content="https://studio-crashout.com/og-image.png" />
  </head>

  <body>
    <div id="root"></div>

    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
